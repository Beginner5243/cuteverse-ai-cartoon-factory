name: CuteVerse Cartoon Pipeline

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number (e.g. 1)"
        required: true
        default: "1"
        type: string
      language:
        description: "Language code: en, hi, or gu"
        required: true
        default: "en"
        type: choice
        options:
          - en
          - hi
          - gu
      duration:
        description: "Duration in seconds (30, 45, or 90)"
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "45"
          - "90"
  schedule:
    - cron: "0 6 * * 1,4"

jobs:
  build-cartoon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CuteVerse pipeline with retry
        id: run_pipeline
        run: |
          EP="${{ github.event.inputs.episode || '1' }}"
          LANG="${{ github.event.inputs.language || 'en' }}"
          DUR="${{ github.event.inputs.duration || '30' }}"
          ATTEMPT=1
          MAX_RETRIES=2
          until python main.py --episode "$EP" --language "$LANG" --duration "$DUR"; do
            if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
              echo "::error::CuteVerse pipeline failed after $MAX_RETRIES attempts for ep=$EP lang=$LANG dur=$DUR"
              exit 1
            fi
            echo "::warning::Attempt $ATTEMPT failed, retrying..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

      - name: Upload episode outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuteverse-ep-${{ github.event.inputs.episode || '1' }}-${{ github.event.inputs.language || 'en' }}
          path: |
            output/videos/
            output/subtitles/
            output/thumbnails/
            output/logs/
            output/reports/
            episodes/scripts/
            episodes/storyboards/
            assets/characters/
          if-no-files-found: warn
          
